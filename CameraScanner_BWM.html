<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kamera Absensi BWM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 35px #0f172a18;text-align:center}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;color:#64748b;line-height:1.5;margin:0 0 16px}video{width:100%;max-height:58vh;background:#0f172a;border-radius:14px;object-fit:cover;transform:scaleX(-1)}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:12px;background:#0d9488;color:white}button.secondary{background:#e2e8f0;color:#0f172a}button:disabled{opacity:.5;cursor:not-allowed}#status{margin-top:12px;font-size:13px;color:#475569;white-space:pre-wrap}
</style></head><body><main class="card"><h1>Kamera Absensi BWM</h1><p>Posisikan wajah di tengah kamera, lalu tekan <b>Ambil Foto</b>. Setelah foto dikirim, kembali ke halaman absensi.</p><video id="video" autoplay playsinline muted></video><button id="capture" disabled>Ambil Foto</button><button id="cancel" class="secondary" type="button">Batal</button><div id="status">Meminta izin kamera...</div><canvas id="canvas" hidden></canvas></main>
<script>
(() => {
 const video=document.getElementById('video'),capture=document.getElementById('capture'),status=document.getElementById('status'),canvas=document.getElementById('canvas');let stream=null;
 async function start(){try{if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Halaman kamera harus dibuka melalui HTTPS di Chrome.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();capture.disabled=false;status.textContent='Kamera siap. Silakan ambil foto.';}catch(e){status.textContent='Kamera tidak dapat dibuka: '+(e.message||e.name)+'\nPeriksa izin Kamera untuk situs HTTPS ini dan tutup aplikasi lain yang memakai kamera.';}}
 function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
 capture.addEventListener('click',()=>{if(!video.videoWidth||!video.videoHeight||!window.opener){status.textContent='Video belum siap atau halaman absensi asal sudah ditutup.';return;}canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext('2d');ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0);const photoData=canvas.toDataURL('image/jpeg',.82);window.opener.postMessage({type:'BWM_CAMERA_CAPTURE',photoData},'*');status.textContent='Foto dikirim ke halaman absensi. Jendela kamera akan ditutup.';capture.disabled=true;stop();setTimeout(()=>window.close(),500);});
 document.getElementById('cancel').addEventListener('click',()=>{stop();window.close();});window.addEventListener('beforeunload',stop);start();
})();
</script></body></html>
